[supervisord]
nodaemon=true
logfile=/workspace/production/logs/supervisord.log
pidfile=/workspace/production/logs/supervisord.pid

[program:gateway]
command=/workspace/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 2222 --workers 1 --loop asyncio --timeout-keep-alive 300
directory=/workspace/production
autostart=true
autorestart=true
startretries=10
startsecs=5
stderr_logfile=/workspace/production/logs/gateway.log
stdout_logfile=/workspace/production/logs/gateway.log
environment=PYTHONPATH="/workspace/production"

[program:vllm]
command=/workspace/venv/bin/python -m vllm.entrypoints.openai.api_server --model /workspace/models/qwen3.6-moe --host 0.0.0.0 --port 1111 --max-model-len 32768 --tensor-parallel-size 1
directory=/workspace
autostart=true
autorestart=true
startretries=5
startsecs=60
stderr_logfile=/workspace/production/logs/vllm.log
stdout_logfile=/workspace/production/logs/vllm.log
